apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Data stored in hostPath' > /host-data/message.txt; sleep 3600"]
      volumeMounts:
        - name: node-data
          mountPath: /host-data
  volumes:
    - name: node-data
      hostPath:
        path: /tmp/session13-hostpath
        type: DirectoryOrCreate
