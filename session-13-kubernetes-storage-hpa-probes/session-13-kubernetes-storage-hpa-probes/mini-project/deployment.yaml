apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-web
  template:
    metadata:
      labels:
        app: storage-web
    spec:
      initContainers:
        - name: initialize-content
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f /data/index.html ]; then
                cp /seed/index.html /data/index.html
              fi
          volumeMounts:
            - name: content-seed
              mountPath: /seed
              readOnly: true
            - name: web-data
              mountPath: /data
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: web-data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content-seed
          configMap:
            name: storage-web-content
        - name: web-data
          persistentVolumeClaim:
            claimName: storage-web-pvc
