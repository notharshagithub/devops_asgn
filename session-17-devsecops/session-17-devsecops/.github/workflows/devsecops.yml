name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Build application sources
        run: python -m compileall -q app
      - name: Run unit tests
        run: |
          mkdir -p reports
          pytest -q --junitxml=reports/junit.xml
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  sast:
    name: SAST - Bandit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Bandit
        run: python -m pip install --upgrade bandit
      - name: Scan application source
        run: bandit -r app -ll -f txt -o bandit-report.txt
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-sast-report
          path: bandit-report.txt
          if-no-files-found: ignore
          retention-days: 14

  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit
      - name: Audit application dependencies
        run: pip-audit --strict -r requirements.txt -r requirements-dev.txt --format json --output pip-audit-report.json
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-report
          path: pip-audit-report.json
          if-no-files-found: ignore
          retention-days: 14

  secret-scan:
    name: Secret scanning - Gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history and files for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: .gitleaks.toml

  container-scan:
    name: Container image scan - Trivy
    runs-on: ubuntu-24.04
    needs: [build-test, sast, sca, secret-scan]
    steps:
      - uses: actions/checkout@v7
      - name: Build image for scanning
        run: docker build --pull -t devsecops-demo:${{ github.sha }} .
      - name: Generate image vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: devsecops-demo:${{ github.sha }}
          format: table
          output: trivy-image-report.txt
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Upload container scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-container-report
          path: trivy-image-report.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce container vulnerability threshold
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: devsecops-demo:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Archive scanned image for promotion
        run: docker save -o devsecops-image.tar devsecops-demo:${{ github.sha }}
      - name: Upload scanned image archive
        uses: actions/upload-artifact@v7
        with:
          name: scanned-container-image
          path: devsecops-image.tar
          retention-days: 1

  security-gate:
    name: Security gate
    if: always()
    needs: [build-test, sast, sca, secret-scan, container-scan]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to succeed
        env:
          BUILD_TEST: ${{ needs.build-test.result }}
          SAST: ${{ needs.sast.result }}
          SCA: ${{ needs.sca.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          CONTAINER_SCAN: ${{ needs.container-scan.result }}
        run: |
          echo "build-test=${BUILD_TEST}"
          echo "sast=${SAST}"
          echo "sca=${SCA}"
          echo "secret-scan=${SECRET_SCAN}"
          echo "container-scan=${CONTAINER_SCAN}"
          for result in "$BUILD_TEST" "$SAST" "$SCA" "$SECRET_SCAN" "$CONTAINER_SCAN"; do
            if [ "$result" != "success" ]; then
              echo "::error::Security gate blocked the release because a required job did not succeed."
              exit 1
            fi
          done
          echo "All required checks passed. Publishing is allowed."

  push-image:
    name: Publish image to GHCR
    needs: [security-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the image that passed Trivy
        uses: actions/download-artifact@v7
        with:
          name: scanned-container-image
      - name: Load scanned image
        run: docker load -i devsecops-image.tar
      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push commit-tagged image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker tag "devsecops-demo:$GITHUB_SHA" "$IMAGE_NAME:$GITHUB_SHA"
          docker tag "devsecops-demo:$GITHUB_SHA" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"

  deploy-kubernetes:
    name: Deploy to Kubernetes (opt-in)
    needs: [push-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TO_K8S == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Configure kubeconfig from repository secret
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "::error::Set the KUBE_CONFIG_B64 repository secret before enabling DEPLOY_TO_K8S."
            exit 1
          fi
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Install kubectl with checksum verification
        run: |
          KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client
      - name: Verify cluster access
        run: kubectl cluster-info
      - name: Apply Kubernetes resources
        env:
          IMAGE_REF: ${{ needs.push-image.outputs.image_name }}:${{ github.sha }}
        run: |
          sed "s|IMAGE_REF_PLACEHOLDER|$IMAGE_REF|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/devsecops-demo --timeout=180s
          kubectl get deployment,pods,service -l app=devsecops-demo -o wide
