apiVersion: apps/v1
kind: Deployment
metadata:
  name: headless-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: headless-app
  template:
    metadata:
      labels:
        app: headless-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: headless-service
spec:
  clusterIP: None
  selector:
    app: headless-app
  ports:
    - port: 80
      targetPort: 80
