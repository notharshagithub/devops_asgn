apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadbalancer-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loadbalancer-app
  template:
    metadata:
      labels:
        app: loadbalancer-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: loadbalancer-service
spec:
  type: LoadBalancer
  selector:
    app: loadbalancer-app
  ports:
    - port: 80
      targetPort: 80
