apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: session12-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: session12.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingress-demo-service
                port:
                  number: 80
