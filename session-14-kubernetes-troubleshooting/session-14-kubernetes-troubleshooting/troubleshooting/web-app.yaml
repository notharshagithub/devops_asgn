apiVersion: apps/v1
kind: Deployment
metadata:
  name: troubleshooting-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: troubleshooting-web
  template:
    metadata:
      labels:
        app: troubleshooting-web
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
