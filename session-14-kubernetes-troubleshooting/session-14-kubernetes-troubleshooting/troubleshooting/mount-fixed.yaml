apiVersion: v1
kind: Pod
metadata:
  name: mount-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "cat /etc/settings/message; sleep 3600"]
    volumeMounts:
    - name: settings
      mountPath: /etc/settings
      readOnly: true
  volumes:
  - name: settings
    configMap:
      name: session14-volume-config
